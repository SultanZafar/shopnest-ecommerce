{% load static %}
<header class="bg-cream/95 backdrop-blur border-b border-forest/10 sticky top-0 z-40">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
    <a href="{% url 'store:home' %}" class="font-display text-2xl font-semibold tracking-tight text-forest shrink-0">
      Shop<span class="text-clay">Nest</span>
    </a>

    <form action="{% url 'store:product_list' %}" method="get" class="hidden md:flex flex-1 max-w-md">
      <input type="text" name="q" placeholder="Search products..." value="{{ request.GET.q }}"
        class="w-full rounded-l-full border border-forest/20 border-r-0 px-4 py-2 text-sm bg-white focus:outline-none">
      <button type="submit" class="rounded-r-full bg-forest text-cream px-4 text-sm font-medium">Search</button>
    </form>

    <nav class="flex items-center gap-4 text-sm font-medium shrink-0">
      <a href="{% url 'store:product_list' %}" class="hover:text-clay transition-colors hidden sm:inline">Shop</a>
      {% if user.is_authenticated %}
        <a href="{% url 'store:wishlist' %}" class="hover:text-clay transition-colors" title="Wishlist">♥ <span class="hidden sm:inline">Wishlist</span></a>
        <a href="{% url 'store:cart' %}" class="relative hover:text-clay transition-colors" title="Cart">
          🛒 <span class="hidden sm:inline">Cart</span>
          {% if nav_cart_count %}
          <span class="absolute -top-2 -right-3 bg-clay text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{{ nav_cart_count }}</span>
          {% endif %}
        </a>
        <a href="{% url 'store:order_history' %}" class="hover:text-clay transition-colors hidden sm:inline">Orders</a>
        <a href="{% url 'accounts:profile' %}" class="hover:text-clay transition-colors">👤 {{ user.first_name|default:user.username }}</a>
        <a href="{% url 'accounts:logout' %}" class="btn-outline !py-1.5 !px-3 text-xs">Logout</a>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="hover:text-clay transition-colors">Login</a>
        <a href="{% url 'accounts:register' %}" class="btn-primary !py-1.5 !px-4 text-xs">Sign up</a>
      {% endif %}
    </nav>
  </div>
</header>
